api:
  base_url: "https://api.openalex.org/works"
  per_page: 200
  mailto: "thesis-bibliometrics@example.com"
  polite_sleep_seconds: 0.15
  max_retries: 4
filters:
  - "from_publication_date:1970-01-01"
  - "language:en"
  - "type:article|review"
queries:
  - name: "title_aryl_hydrocarbon_receptor"
    filter: "title.search.exact:\"aryl hydrocarbon receptor\""
    rationale: "High-precision title hits using the full receptor name."
  - name: "abstract_aryl_hydrocarbon_receptor"
    filter: "abstract.search.exact:\"aryl hydrocarbon receptor\""
    rationale: "Captures papers that define or mention the receptor explicitly in the abstract."
  - name: "title_ah_receptor"
    filter: "title.search.exact:\"ah receptor\""
    rationale: "Legacy abbreviation used in older literature."
  - name: "abstract_ah_receptor"
    filter: "abstract.search.exact:\"ah receptor\""
    rationale: "Legacy abbreviation used in abstracts."
  - name: "title_dioxin_receptor"
    filter: "title.search.exact:\"dioxin receptor\""
    rationale: "Older toxicology-oriented synonym."
  - name: "abstract_dioxin_receptor"
    filter: "abstract.search.exact:\"dioxin receptor\""
    rationale: "Older toxicology-oriented synonym."
  - name: "title_ahr"
    filter: "title.search.exact:\"ahr\""
    rationale: "Adds title-level AhR acronym usage, then validated locally to avoid ambiguity."
validation:
  minimum_publication_year: 1970
  precise_patterns:
    - "aryl hydrocarbon receptor"
    - "aryl-hydrocarbon receptor"
    - "ah receptor"
    - "dioxin receptor"
  acronym_patterns:
    - "\\bahr\\b"
    - "\\bahr signaling\\b"
    - "\\bahr activation\\b"
    - "\\bahr ligand\\b"
    - "\\bahr-dependent\\b"
  acronym_context_anchors:
    - "receptor"
    - "ligand"
    - "dioxin"
    - "xenobiotic"
    - "cyp1a1"
    - "cyp1b1"
    - "tryptophan"
    - "kynurenine"
    - "immune"
    - "inflammation"
    - "tumor"
    - "tumour"
    - "cancer"
    - "microbiome"
    - "microbiota"
    - "barrier"
    - "intestinal"
    - "gut"
    - "mucosal"
    - "skin"
    - "metabolism"
    - "toxicology"
  exclude_patterns:
    - "hazard ratio"
    - "adjusted hazard ratio"
    - "accelerated heart rate"
time_slices:
  - label: "1980-1999"
    start_year: 1980
    end_year: 1999
  - label: "2000-2012"
    start_year: 2000
    end_year: 2012
  - label: "2013-2026"
    start_year: 2013
    end_year: 2026
focus_subsets:
  immune_barrier_microbiome:
    - "immune"
    - "inflammation"
    - "microbiome"
    - "microbiota"
    - "barrier"
    - "mucosal"
    - "intestinal"
    - "gut"
    - "il-22"
    - "treg"
    - "th17"
